name: Delibes numeric diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            disable: ''
          - label: scalar
            disable: 'X86_V4 AVX512_ICL AVX512_SPR'
    env:
      NPY_DISABLE_CPU_FEATURES: ${{ matrix.disable }}
      PYTHONWARNINGS: always
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: elizaOS/llama.cpp
          ref: 6337fd4c4bd071c17235986344d552d4036e177b
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.11'
      - run: python -m pip install numpy==2.5.4 onnx==1.20.1 pyyaml tqdm requests
      - name: Convert pinned Delibes with unchanged converter
        shell: bash
        run: |
          python -u - <<'PY'
          import hashlib,json,pathlib,sys,urllib.request,numpy as np
          sys.path.insert(0,'tools/paradee')
          import convert_paradee_onnx_to_gguf as convert
          pin=json.loads(pathlib.Path('tools/paradee/pins.json').read_text())['delibes']
          root=pathlib.Path('diagnostic-inputs')
          for rel in ['onnx/fp32/text.onnx','onnx/fp32/decoder.onnx','config.json']:
              path=root/rel
              path.parent.mkdir(parents=True,exist_ok=True)
              url='https://huggingface.co/'+pin['model']['repo']+'/resolve/'+pin['model']['revision']+'/'+rel
              with urllib.request.urlopen(url,timeout=90) as response:
                  path.write_bytes(response.read())
              data=path.read_bytes()
              assert len(data)==pin['files'][rel]['size']
              assert hashlib.sha256(data).hexdigest()==pin['files'][rel]['sha256']
          print('NUMPY',np.__version__,np.lib.introspect.opt_func_info(func_name='log1p'),flush=True)
          np.show_runtime()
          result=convert.main(['--family','delibes','--model-dir',str(root),'--output','diagnostic.gguf','--check-output'])
          print('CONVERTER_RESULT',result,flush=True)
          PY
