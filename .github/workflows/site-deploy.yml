name: Alpha site

on:
  push:
    branches: [vibestack]
    paths:
      - 'apps/site/**'
      - 'apps/app/public/logo-mark.svg'
      - 'apps/app/public/denton-300.woff2'
      - 'apps/app/public/fonts/5ed4d31c988e73b25889.woff2'
      - '.github/workflows/site-deploy.yml'

permissions:
  contents: read

concurrency:
  group: alpha-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_id == '1396333361'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: alpha-site-production
      url: https://alphaphone.dev/
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Build the landing page
        run: node build.mjs
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_API_TOKEN in alpha-site-production.' >&2
            exit 1
          fi
          npx --yes wrangler@4.166.0 pages deploy dist --project-name=alphaphone --branch=vibestack --commit-hash="$GITHUB_SHA" --commit-dirty=false
