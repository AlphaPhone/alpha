name: Alpha site
# Builds apps/site (spec/site/) through turbo and uploads it to the Cloudflare Pages project alphaphone.
# The GitHub environment alpha-site-production admits main and holds the CLOUDFLARE_ACCOUNT_ID variable and the
# CLOUDFLARE_PAGES_API_TOKEN secret (Cloudflare Pages Edit on that account).
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - spec/site/**
      - packages/design-system/**
      - packages/ui/**
      - .github/workflows/site-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-site-production
  cancel-in-progress: false
env:
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  deploy:
    if: github.repository_id == '1396333361' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: alpha-site-production
      url: https://alphaphone.dev/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: ""
          verification: "false"
      - name: Build the site
        run: pnpm all @repo/site#build
      - name: Deploy to Cloudflare Pages
        working-directory: apps/site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_API_TOKEN in alpha-site-production.' >&2
            exit 1
          fi
          npx --yes wrangler@4.166.0 pages deploy dist --project-name=alphaphone --branch=vibestack --commit-hash="$GITHUB_SHA" --commit-dirty=false
