name: Android foundation
on:
  # The build's inputs: Android and renderer sources, the scripts and root configuration that
  # produce the APKs, the lockfile and the upstream pin. Documentation-only changes do not run it.
  pull_request:
    paths:
      - 'android/**'
      - 'apps/app/**'
      - 'scripts/**'
      - 'licenses/**'
      - app.config.json
      - capacitor.config.ts
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - upstream.lock.json
      - .gitmodules
      - vendor/eliza
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
  # The native input artifacts are read through the workflow token.
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The post-build owner checks run under node --test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # Native engine wrappers (prepare-embedding-host) require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: pnpm install --frozen-lockfile
      # The Calendar bridge needs the pinned org.json jar.
      - name: Prepare normal host-test JSON
        timeout-minutes: 1
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Prepare reviewed Kotlin compiler for native routing checks
        run: node test/fixtures/kotlin-tools.mjs --prepare
      - name: Compile the pinned SDK CLI before the parallel launcher tests
        working-directory: vendor/eliza/packages/os
        run: |
          status=0
          VIBELANG_PROJECT="$PWD/tsconfig.build.json" node --no-warnings --conditions eliza-source --import vibelang/register src/cli.vibe > "$RUNNER_TEMP/alpha-os-cli.log" 2>&1 || status=$?
          if [ "$status" -ne 2 ] || ! grep -Fq 'a command is required' "$RUNNER_TEMP/alpha-os-cli.log"; then
            cat "$RUNNER_TEMP/alpha-os-cli.log" >&2
            exit 1
          fi
      - name: Verify launcher overlay staging from the pinned SDK
        run: pnpm --dir vendor/eliza/packages/os run test test/image.test.vibe test/image-product.test.vibe test/cli.test.vibe
      # The normal chain builds and verifies its native source/model inputs.
      - name: Record tracked source frame before the Android build
        timeout-minutes: 1
        env:
          ALPHA_CALENDAR_BRIDGE_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/ci/calendar-bridge.py --source-frame
      - name: Build the launcher APKs
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          # Reuse the exact submodule already fetched by checkout; do not re-fetch the private SDK anonymously.
          ALPHA_RUNTIME_GIT_CACHE: ${{ github.workspace }}/vendor/eliza
          # A clean release R8 pass exhausted the default 2 GiB heap on this runner.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: pnpm android:build:local --release
      - name: Qualify generated native admission and staged wallet exclusion
        shell: bash
        run: |
          set -euo pipefail
          test -f .eliza/native-inputs/receipt.json
          test -f android/app/src/main/assets/agent/manifest.json
          node --test --test-concurrency=1 --test-reporter=tap test/voice-host-record.test.mjs test/wallet-disabled.test.mjs | tee artifacts/android-postbuild-owners.tap
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          text = pathlib.Path('artifacts/android-postbuild-owners.tap').read_text()
          for field in ('fail', 'skipped', 'cancelled'):
              assert re.search(r'^# ' + field + r' 0\s*$', text, re.M), field + ' must be zero'
          for name in ('generated native admission refuses a wrong consumer pin and changed output bytes', 'a staged resident runtime inventory lists no @metamask/*, wagmi or @rainbow-me/* package'):
              assert re.search(r'^ok \d+ - ' + re.escape(name) + r'\s*$', text, re.M), name
          digest = lambda file: hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()
          record = {'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'tests':int(re.search(r'^# tests (\d+)\s*$', text, re.M)[1]), 'skipped':0,
                    'nativeReceiptSha256':digest('.eliza/native-inputs/receipt.json'), 'runtimeInventorySha256':digest('android/app/src/main/assets/agent/manifest.json'),
                    'scope':'Actual normal producer receipt and staged runtime inventory; no device execution.'}
          pathlib.Path('artifacts/android-postbuild-owners.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      # Use actual normal JavaCompile outputs; this qualification assembles no extra APK.
      # It reads ALPHA_JSON_JAR from the host-test JSON step above.
      - name: Qualify actual Calendar bridge in normal Java compile context
        timeout-minutes: 4
        env:
          ALPHA_CALENDAR_BRIDGE_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/ci/calendar-bridge.py
      # Alpha's JVM unit tests for its forked native UI (android/app/src/test, Robolectric) on the
      # Gradle host the build generated. JVM evidence only, not device evidence.
      - name: Run Alpha's native unit tests
        timeout-minutes: 15
        working-directory: android
        run: ./gradlew --no-daemon :app:testLauncherDebugUnitTest
      # The build staged the workflow worker artifact (pnpm agent:build-workflow-worker); its proof is exported here.
      - name: Export the portable worker dependency proof
        run: node --conditions=eliza-source --import vibelang/register scripts/ci/export-browser-proof.ts worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-proof-worker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-proof/worker/
          retention-days: 3
          if-no-files-found: error
      - name: Require flag-off APKs
        run: |
          node --conditions=eliza-source --import vibelang/register scripts/audit-production-bundle.ts web-dist
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('artifacts/apk-manifest.json', 'utf8'));
          if (manifest.testMocks !== false || manifest.demoEntryPoints !== false) throw new Error('APKs must be testMocks:false and demoEntryPoints:false');
          if (manifest.results.length !== 2 || manifest.results.some(row => row.testMocks !== false || row.bundleAudit !== 'passed' || row.runtime !== 'PACKAGED')) throw new Error('Both launcher APKs must pass the flag-off bundle audit and package the runtime');
          console.log(JSON.stringify({ testMocks: manifest.testMocks, demoEntryPoints: manifest.demoEntryPoints, version: manifest.version, signing: manifest.signing.release }, null, 2));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-distribution-apks-${{ github.run_id }}-${{ github.run_attempt }}
          # R8 mappings travel with the exact APKs they deobfuscate.
          path: |
            artifacts/*.apk
            artifacts/mapping/*.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-build-evidence
          path: |
            artifacts/*.json
            # Written offline by the build beside the APKs it verified (scripts/generate-sbom.ts).
            artifacts/sbom/*.json
            artifacts/android-postbuild-owners.tap
            test-results/
            android/app/build/reports/
            android/voice-host/qualified-voice-host.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/inputs.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/taskgraph.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/bridge.log
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/result.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/gradle.log
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/supervisor.json
          retention-days: 3
