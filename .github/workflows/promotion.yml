name: Promotion checks
# Checks for promoting develop to main: the spec check (Quint models, Dafny proofs and Bombadil
# exploration of apps/app/spec), the tests, the browser journeys, Firefox/WebKit storage and the
# production surface. Nothing here runs on pull requests
# into develop or on pushes; authors run `pnpm check`, `pnpm test:browser` and
# `pnpm test:browser:production` locally.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spec:
    name: Specs, models and generated conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      # Promotion refuses a pin the upstream branch cannot reach, or a recorded compare that is not for the pin
      # (refresh it with scripts/verify-upstream.ts --record-reachability). Pull requests only warn (verify.yml).
      - name: Upstream branch reaches the pin
        run: node --conditions=eliza-source --import vibelang/register scripts/verify-upstream.ts --reachability-only --upstream-reachability=fail
      # The proof stage runs Dafny; the explore stage drives Bombadil in Chromium.
      - name: Install Dafny
        run: bash scripts/ci/prepare-dafny.sh
      - run: bash scripts/ci/install-playwright-browser.sh chromium
      - name: Spec check (stories, rules, Quint models and proofs of apps/app/spec)
        run: pnpm check
      - name: Unit, journey and generated conformance tests
        run: pnpm test
  browser:
    name: Browser journeys (Vitest browser project)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/install-playwright-browser.sh chromium
      - name: Browser journeys and story mounts on the flag-on development build
        env:
          # Development journeys opt into test mocks, fixtures and device controls explicitly.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        run: pnpm test:browser
  storage:
    name: Browser storage (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Free disk on the disposable browser runner
        if: runner.environment == 'github-hosted'
        run: |
          for unused in /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/powershell; do
            if [ -d "$unused" ]; then sudo rm -rf -- "$unused"; fi
          done
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - name: Install storage browser and system dependencies
        run: bash scripts/ci/install-playwright-browser.sh ${{ matrix.browser }}
      - name: Start the headless Firefox audio device
        if: matrix.browser == 'firefox'
        # Firefox needs an audio server for real Web Audio capture, even when the
        # oscillator only feeds MediaRecorder and playback is muted.
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=alpha_browser_audio
          pactl set-default-sink alpha_browser_audio
          pactl info
      - name: Storage contracts on the flag-on development server
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        # The selected project uses the existing storageSpecPattern in playwright.config.ts.
        # test:browser selects Chromium, so invoke Playwright directly for this matrix.
        run: pnpm exec --no-install playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-storage-${{ matrix.browser }}
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 3
  production:
    name: Browser production surface (flag off)
    # Runs production-surface.spec.ts and every *.production.spec.ts (playwright.config.ts).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/install-playwright-browser.sh chromium
      - name: Test-mocks bundle records its flag
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        run: |
          pnpm --filter @alphacompute/alphaphone-app exec vite build --outDir ../../../../test-results/test-mocks-web
          node scripts/write-build-flags.ts test-results/test-mocks-web
          node --conditions=eliza-source --import vibelang/register scripts/audit-production-bundle.ts test-results/test-mocks-web --expect-test-mocks
      # Builds and previews a flag-off bundle; the flag is deliberately unset here.
      - run: pnpm test:browser:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-production-surface
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 3
