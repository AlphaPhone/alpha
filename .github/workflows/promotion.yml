name: Promotion checks

# Full uncached verification gate for promoting to main:
# runs Node 26 + pnpm verify without cached verification receipts, verifies third-party
# notices, checks zero Bun usage, and confirms the pinned Eliza commit is reachable upstream.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify-fresh:
    name: Record the authorized Alpha spec ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: promotion
          verification: "true"
          cache-verification: "false"
      - name: Verify zero Bun
        run: pnpm no-bun
      - name: Prepare pinned Eliza checkout and verify upstream reachability
        run: |
          pnpm eliza
          pnpm --filter @repo/app android pin
      - name: Verify third-party notices and release signer record
        run: |
          pnpm --filter @repo/app licences --check
          python3 scripts/ci/app_update_producer.py signer-record apps/app/aosp/signing/release-signer.json
      - name: Build the verification prerequisites
        run: pnpm all build --concurrency=4 --continue=dependencies-successful --log-order=stream
      - name: Record the spec ledger after verification passes
        run: |
          pnpm accept
          git diff --exit-code -- . ':!spec/lock.json'
          test -n "$(git diff --name-only -- spec/lock.json)"
          sha256sum spec/lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: accepted-alpha-spec-ledger
          path: spec/lock.json
          if-no-files-found: error
