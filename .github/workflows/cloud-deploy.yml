name: Cloud deploy
run-name: Alpha Cloud ${{ inputs.action }} (${{ inputs.environment }}) on ${{ github.sha }}
# Deploys Alpha Cloud (docs/alpha-cloud.md): the workspace @elizaos/cloud package with Alpha's deployment
# profile (cloud/src/profile.vibe), the API Worker (cloud/src/worker.vibe) and the web host Worker
# (cloud/src/edge.vibe). Manual and main-only. Deployment stays behind the ALPHA_CLOUD_CUTOVER flag:
# deploying the Cloud never changes which Cloud a distributed app build uses.
#
# Each GitHub environment (alpha-cloud-staging, alpha-cloud-production) holds:
#   secret CLOUDFLARE_API_TOKEN   Workers Scripts/Routes/Hyperdrive edit + Zone DNS edit
#   secret ALPHA_CLOUD_ENV        the COMPLETED env file from `pnpm cloud:worker secrets` (run once locally)
#   secret ALPHA_CLOUD_INPUTS     the reviewed operator inputs JSON (cloud/src/profile.vibe OperatorInputs)
# Account and resource ids come from the committed cloud/resources.json.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        type: choice
        options: [staging, production]
      action:
        description: "check: render and bundle only. deploy: secrets, migrations, registration, Workers, prices, smoke."
        required: true
        type: choice
        options: [check, deploy]
      component:
        description: Worker to deploy (deploy only)
        required: true
        default: all
        type: choice
        options: [all, api, edge]
permissions:
  contents: read
concurrency:
  group: alpha-cloud-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  cloud:
    if: github.repository_id == '1396333361' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: alpha-cloud-${{ inputs.environment }}
    env:
      CLOUD: node scripts/cloud-worker.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - name: Build the cloud packages and Workers
        run: pnpm exec turbo run build --filter=@alphacompute/alpha-cloud
      - name: Write the private inputs
        env:
          ALPHA_CLOUD_ENV: ${{ secrets.ALPHA_CLOUD_ENV }}
          ALPHA_CLOUD_INPUTS: ${{ secrets.ALPHA_CLOUD_INPUTS }}
        run: |
          umask 077
          printf '%s\n' "$ALPHA_CLOUD_ENV" > "$RUNNER_TEMP/alpha-cloud.env"
          printf '%s\n' "$ALPHA_CLOUD_INPUTS" > "$RUNNER_TEMP/alpha-cloud-inputs.json"
      - name: Render and bundle (dry run)
        run: $CLOUD check --environment "${{ inputs.environment }}" --inputs "$RUNNER_TEMP/alpha-cloud-inputs.json" --out "$RUNNER_TEMP/rendered"
      - name: Verify the secrets
        if: inputs.action == 'deploy'
        run: $CLOUD secrets --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Preflight the Cloudflare resources
        if: inputs.action == 'deploy'
        run: $CLOUD preflight --environment "${{ inputs.environment }}" --env-file "$RUNNER_TEMP/alpha-cloud.env"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Migrate the database
        if: inputs.action == 'deploy'
        run: $CLOUD migrate --environment "${{ inputs.environment }}" --inputs "$RUNNER_TEMP/alpha-cloud-inputs.json" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Register Alpha Phone's native client
        if: inputs.action == 'deploy'
        run: $CLOUD seed --environment "${{ inputs.environment }}" --inputs "$RUNNER_TEMP/alpha-cloud-inputs.json" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Check the payment catalogue
        if: inputs.action == 'deploy'
        run: $CLOUD prices --environment "${{ inputs.environment }}" --inputs "$RUNNER_TEMP/alpha-cloud-inputs.json" --env-file "$RUNNER_TEMP/alpha-cloud.env"
      - name: Deploy the Workers
        if: inputs.action == 'deploy'
        run: $CLOUD deploy --environment "${{ inputs.environment }}" --inputs "$RUNNER_TEMP/alpha-cloud-inputs.json" --env-file "$RUNNER_TEMP/alpha-cloud.env" --component "${{ inputs.component }}" --out "$RUNNER_TEMP/rendered"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Public readiness
        if: inputs.action == 'deploy'
        run: $CLOUD smoke --environment "${{ inputs.environment }}"
      - name: Remove the private inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/alpha-cloud.env" "$RUNNER_TEMP/alpha-cloud-inputs.json"
