name: Verify
# The one check every pull request runs: `pnpm verify` (Cloud deployment outputs, spec check, typecheck,
# tests, lint, the production build and its bundle audit). Browser tests run in promotion.yml when develop
# is promoted to main; authors run them locally before finalising a pull request.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned host JSON test dependency
        run: bash scripts/ci/prepare-host-test-json.sh
      # pnpm verify runs the spec check: its proof stage needs Dafny and its explore stage Chromium.
      - name: Install Dafny
        run: bash scripts/ci/prepare-dafny.sh
      - run: bash scripts/ci/install-playwright-browser.sh chromium
      - run: pnpm verify
      - name: Build the connected browser proof renderer
        env:
          VITE_ALPHA_CLOUD_RESIDENT: '1'
          VITE_ALPHA_CLOUD_ENVIRONMENT: staging
          VITE_LOCAL_AGENT: '1'
          ELIZA_DEV_ALLOW_TEST_MOCKS: ''
        run: |
          pnpm --filter @alphacompute/alphaphone-app exec vite build --outDir ../../../../test-results/browser-proof-renderer
          node scripts/write-build-flags.ts test-results/browser-proof-renderer
          node scripts/audit-production-bundle.ts test-results/browser-proof-renderer
          node scripts/ci/export-browser-proof.ts renderer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-proof-renderer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-proof/renderer/
          retention-days: 3
          if-no-files-found: error
      # Recorded upstream compare; warns (never networks) when the upstream branch cannot reach the pin.
      - name: Report upstream reachability
        run: node --conditions=eliza-source --import vibelang/register scripts/verify-upstream.ts --reachability-only
