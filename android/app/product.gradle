// Alpha product configuration applied by the generated host (android/consumer-host.json,
// appScripts). The upstream generator owns SDK, dependencies, the launcher variant, signing and
// version policy; this file holds only Alpha's Gradle-time product
// inputs and admission: App Links, update manifest, voice and embedding hosts.
// Every build packages the resident runtime, on-device speech and local embeddings; the renderer
// chooses Cloud, provider or on-device speech at run time. The resident agent receives
// ELIZA_RUNTIME_PROFILE=native (upstream's local-embeddings route).
// Debug packages the ABIs resident staging produces (scripts/stage-agent-runtime.ts);
// dependency ABI flags do not filter the app. Release is arm64-v8a (android/consumer-host.json).
// Preserve installed component and callback names when the current source is packaged for
// an existing identity. The generated view contains the same feature code, not another flavor.
def generatedHostProfile = new groovy.json.JsonSlurper().parse(rootProject.file('.eliza-consumer-profile.json'))
def identityAsset = generatedHostProfile.assetFiles.find { it.name == 'android-identity.json' }
def projectedIdentity = identityAsset == null ? null : new groovy.json.JsonSlurper().parse(file(identityAsset.source))
if (identityAsset != null) {
 if (projectedIdentity.schema != 1 || projectedIdentity.applicationId != android.defaultConfig.applicationId ||
     projectedIdentity.sourceApplicationId == projectedIdentity.applicationId)
  throw new GradleException('Generated Android identity differs from the application')
 def projectedRoot = file(identityAsset.source).parentFile
 android.sourceSets.all { sources ->
  // Replace the whole authored Java root: instrumentation helpers can keep a shared
  // package while importing the selected product identity. Pinned module roots stay intact.
  def authoredJava = file('src/' + sources.name + '/java')
  def projectedJava = new File(projectedRoot, 'android/app/src/' + sources.name + '/java')
  if (projectedJava.isDirectory()) {
   sources.java.setSrcDirs(sources.java.srcDirs.collect { directory ->
    directory.canonicalFile == authoredJava.canonicalFile ? projectedJava : directory
   }.unique())
  }
  def manifest = new File(projectedRoot, 'android/app/src/' + sources.name + '/AndroidManifest.xml')
  if (manifest.isFile()) sources.manifest.srcFile manifest
 }
}
def runtimeAbis = ['arm64-v8a', 'x86_64']
// The upstream os speech modules (:eliza-local-inference over :eliza-voice-io) read these when they are
// configured, which is after :app. The speech bridges (LocalSpeechBridgePlugin, SpeechStreamBridgePlugin)
// compile into :eliza-local-inference; AlphaVoiceCloud and AlphaCloudSpeechStream are Alpha's subclasses.
def inferenceModule = file('../../vendor/eliza/packages/os/android/local-inference')
if (!new File(inferenceModule, 'engine.lock.json').isFile()) throw new GradleException('The pinned upstream has no os local-inference module (vendor/eliza/packages/os/android/local-inference)')
def inferenceEngineLock = new groovy.json.JsonSlurper().parse(new File(inferenceModule, 'engine.lock.json'))
rootProject.ext.elizaSpeechBridgeCapacitor = 'true'
rootProject.ext.elizaInferenceEngineDir = rootProject.findProperty('elizaInferenceEngineDir') ?: file('../../.eliza/inference-engine/' + inferenceEngineLock.engine.commit).absolutePath
rootProject.ext.elizaParadeeNativeDir = rootProject.findProperty('elizaParadeeNativeDir') ?: file('../../.eliza/paradee-voice/native').absolutePath
rootProject.ext.elizaParadeeAbis = rootProject.findProperty('elizaParadeeAbis') ?: runtimeAbis.join(',')
apply from: file('cloud-deployment.generated.gradle')
def cloudWebHost = alphaCloudWebHosts.production
// Verified App Links return for Cloud delegation, the in-app Cloud sign-in and the Google
// Workspace consent return (GoogleWorkspaceReturn) at the configured production web host.
// AndroidManifest.xml declares the exact sign-in and Google callback paths. Publish the
// assetlinks.json rendered by scripts/render-assetlinks.ts on that configured host.
def appLinkHost = cloudWebHost
// One-tap app update (AlphaDevicePlugin checkForUpdate): the one HTTPS update manifest, app.config.json updateManifestUrl.
def updateManifestUrl = projectedIdentity == null ? new groovy.json.JsonSlurper().parse(file('../../app.config.json')).updateManifestUrl : projectedIdentity.updateManifestUrl
if (!(updateManifestUrl instanceof String) || new URI(updateManifestUrl).scheme != 'https' || !new URI(updateManifestUrl).host)
 throw new GradleException('app.config.json updateManifestUrl must be an HTTPS URL')
def updateManifestSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(updateManifestUrl.getBytes('UTF-8')).encodeHex().toString()

android {
 buildTypes {
  debug {
   // Match the resident runtime and reviewed native libraries; dependencies may also ship 32-bit ABIs.
   ndk { abiFilters.addAll(runtimeAbis) }
  }
 }
 defaultConfig {
  manifestPlaceholders.put('appLinkHost', appLinkHost)
  manifestPlaceholders.put('alphaUpdateChannel', 'public')
  manifestPlaceholders.put('alphaUpdateManifestSha256', 'sha256:' + updateManifestSha256)
  // Constant: the value the resident agent is launched with (AlphaLocalAgentPlugin).
  buildConfigField 'String', 'ELIZA_RUNTIME_PROFILE', '"native"'
  // The verified App Link host this build declares: the production Cloud web host.
  buildConfigField 'String', 'ELIZAOS_APP_LINK_HOST', "\"${appLinkHost}\""
  buildConfigField 'String', 'ALPHA_UPDATE_MANIFEST_URL', "\"${updateManifestUrl}\""
  // The shared voice loader configures Phonon-2's in-tree ggml backend.
  // Empty decode threads means one per big core.
  buildConfigField 'String', 'ELIZA_ASR_THREADS', '""'
  // The source commit each voice latency trial records (shared VoiceLatencyProbe via AlphaApplication).
  // A tree with tracked changes is recorded as dirty; the aggregator never accepts dirty trials.
  def sourceGit = { List<String> command ->
   try { providers.exec { commandLine(['git', '-C', rootProject.projectDir.parentFile.absolutePath] + command) }.standardOutput.asText.get().trim() }
   catch (Exception unavailable) { null }
  }
  def elizaSourceCommit = sourceGit(['rev-parse', 'HEAD']) ?: ''
  def elizaSourceStatus = sourceGit(['status', '--porcelain', '--untracked-files=no'])
  buildConfigField 'String', 'ELIZA_SOURCE_COMMIT', "\"${elizaSourceCommit ==~ /[0-9a-f]{40}/ ? elizaSourceCommit : 'unknown'}\""
  buildConfigField 'boolean', 'ELIZA_SOURCE_DIRTY', elizaSourceStatus == null || !elizaSourceStatus.isEmpty() ? 'true' : 'false'
 }
}

// Alpha's own library dependencies. The schema-2 host profile admits only toolchain-keyed modules
// (upstream androidHost.md: "a versioned coordinate has no toolchain key"), so the versioned
// artifacts Alpha's own classes and tests compile against are declared here. Upstream os modules
// declare theirs as implementation, which does not reach :app.
dependencies {
 implementation 'androidx.credentials:credentials:1.6.0'
 implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
 implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
 implementation 'androidx.browser:browser:1.9.0'
 implementation 'com.squareup.okhttp3:okhttp:5.3.2'
 implementation 'androidx.media3:media3-transformer:1.11.1'
 implementation 'androidx.media3:media3-effect:1.11.1'
 implementation 'androidx.work:work-runtime:2.11.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
 androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.7.0'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.16.1'
}

// The shared bionic host is packaged only from the reviewed consumer artifact and BGE pin.
def verifyEmbeddingHost = tasks.register('verifyEmbeddingHost', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine 'node', 'scripts/stage-embedding-host.ts', '--verify'
}
tasks.named('preBuild').configure { dependsOn verifyEmbeddingHost }

// On-device voice: the shared paradee-voice library (:local-speech) links libelizainference but does
// not package it; the app packages its resident host's engine, so the two must be identical bytes.
// Staged voice outputs must also be the bytes android/voice-host/qualified-voice-host.json records.
// The listener APK packages its own verified copy of the engine.
def paradeeAbiArgs = runtimeAbis.collectMany { ['--abi', it] }
def verifyParadeeAppLinkage = tasks.register('verifyParadeeAppLinkage', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine(['node', 'scripts/paradee-runtime.ts', '--app-linkage'] + paradeeAbiArgs)
}
def verifyVoiceHost = tasks.register('verifyVoiceHost', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine(['node', 'scripts/voice-host.ts', '--verify'] + paradeeAbiArgs)
}
tasks.named('preBuild').configure { dependsOn verifyParadeeAppLinkage, verifyVoiceHost }

// Alpha-owned copies of shared classes that present UI but must keep their shared names
// (android/shared-ui-overrides.json): a package-private class the shared module reaches, or an
// installed component name. Each copy replaces exactly that one file in the shared module's own
// compile; every other shared file compiles unchanged. test/shared-ui-overrides.test.mjs keeps each
// copy the pinned upstream source apart from Alpha's listed changes.
def sharedUiOverrides = new groovy.json.JsonSlurper().parse(file('../shared-ui-overrides.json'))
if (sharedUiOverrides.schema != 1) throw new GradleException('android/shared-ui-overrides.json schema must be 1')
sharedUiOverrides.overrides.each { entry ->
 def module = rootProject.project(":${entry.module}")
 def relative = entry['class'].replace('.', '/') + '.java'
 def copy = new File(rootProject.projectDir.parentFile, "${entry.source}/${relative}")
 if (!copy.isFile()) throw new GradleException("Alpha's copy of ${entry['class']} is missing: ${copy}")
 if (module.state.executed) throw new GradleException("${module.path} was configured before Alpha's copy of ${entry['class']} could replace the shared one")
 module.pluginManager.withPlugin('com.android.library') {
  def replaced = new File(module.projectDir, "src/main/java/${relative}").canonicalFile
  if (!replaced.isFile()) throw new GradleException("Shared ${entry['class']} is not at ${replaced}")
  def overrideRoot = copy.parentFile
  for (int depth = entry['class'].count('.'); depth > 0; depth--) overrideRoot = overrideRoot.parentFile
  module.android.sourceSets.main.java.srcDir(overrideRoot)
  module.android.sourceSets.main.java.filter.exclude { element -> element.file.canonicalFile == replaced }
 }
}
