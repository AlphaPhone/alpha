// Alpha's local speech bridge (AlphaVoiceCloud) over the upstream os local-inference module (:eliza-local-inference,
// vendor/eliza/packages/os/android/local-inference): one JNI bridge, libparadeevoicejni.so bound to ai/eliza/voice/VoiceNative.
apply plugin: 'com.android.library'
def inference = file('../../vendor/eliza/packages/os/android/local-inference')
if (!new File(inference, 'engine.lock.json').isFile()) throw new GradleException('The pinned upstream has no os local-inference module (vendor/eliza/packages/os/android/local-inference)')
def engineLock = new groovy.json.JsonSlurper().parse(new File(inference, 'engine.lock.json'))
def paradeeAbiArgs = ['arm64-v8a', 'x86_64'].collectMany { ['--abi', it] }
rootProject.ext.elizaInferenceEngineDir = rootProject.findProperty('elizaInferenceEngineDir') ?: file('../../.eliza/inference-engine/' + engineLock.engine.commit).absolutePath
rootProject.ext.elizaParadeeNativeDir = rootProject.findProperty('elizaParadeeNativeDir') ?: file('../../.eliza/paradee-voice/native').absolutePath
rootProject.ext.elizaParadeeAbis = rootProject.findProperty('elizaParadeeAbis') ?: 'arm64-v8a,x86_64'
android {
 namespace 'ai.alphacompute.alphaphone.speech'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig { minSdk 29; targetSdk rootProject.ext.targetSdkVersion }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
dependencies {
 api project(':eliza-local-inference')
 implementation project(':capacitor-android')
 // Shared relay compiles against the same pinned OkHttp API implemented by the app.
 compileOnly 'com.squareup.okhttp3:okhttp:5.3.2'
}
def verifySpeechInputs = tasks.register('verifySpeechInputs', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine(['node', 'scripts/paradee-runtime.ts'] + paradeeAbiArgs)
}
tasks.named('preBuild').configure { dependsOn verifySpeechInputs }
