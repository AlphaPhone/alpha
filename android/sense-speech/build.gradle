// Sense is a separate APK and owns its complete runtime: the upstream os local-inference module
// (vendor/eliza/packages/os/android/local-inference/consumer.gradle) with the same staged native outputs.
ext.elizaParadeeSourceDir = file('../../vendor/eliza/packages/os/android/local-inference')
ext.elizaParadeeNativeDir = rootProject.findProperty('elizaParadeeNativeDir') ?: file('../../.eliza/paradee-voice/native')
ext.elizaInferenceEngineDir = rootProject.findProperty('elizaInferenceEngineDir') ?: file('../../.eliza/inference-engine/' + new groovy.json.JsonSlurper().parse(new File(elizaParadeeSourceDir, 'engine.lock.json')).engine.commit)
ext.elizaParadeeAbis = 'arm64-v8a'
apply from: new File(elizaParadeeSourceDir, 'consumer.gradle')
def verifySenseVoice = tasks.register('verifySenseVoice', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine 'node', 'scripts/voice-host.ts', '--verify'
}
tasks.named('preBuild').configure { dependsOn verifySenseVoice }
